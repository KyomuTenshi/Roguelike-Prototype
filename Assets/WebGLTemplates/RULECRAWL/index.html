<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading">
        <div id="unity-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress"><div id="unity-progress-fill"></div></div>
        <div id="unity-percent">0%</div>
      </div>

      <div id="unity-warning"></div>

      <!-- phones held upright: the game is played sideways -->
      <div id="unity-rotate">
        <svg viewBox="0 0 32 32" width="72" height="72" shape-rendering="crispEdges">
          <path d="M11 4h10v2H11zM9 6h2v20H9zM21 6h2v20h-2zM11 26h10v2H11zM15 23h2v2h-2z" fill="currentColor"/>
          <path d="M25 9h2v2h2v2h-2v2h-2zM27 13h2v6h-2z" fill="currentColor" opacity="0.6"/>
        </svg>
        <div id="unity-rotate-text">Rotate your phone</div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var fill = document.querySelector("#unity-progress-fill");
      var percent = document.querySelector("#unity-percent");
      var warning = document.querySelector("#unity-warning");

      // the "turn your phone" note in the player's language
      var rotateTexts = { ru: "Поверни телефон горизонтально", zh: "请横屏游玩", es: "Gira el teléfono en horizontal" };
      var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
      document.querySelector("#unity-rotate-text").textContent = rotateTexts[lang] || "Turn your phone sideways";

      // no long-press menu, no text selection over the game
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });


      // Errors and warnings from the engine, shown over the game for a few seconds.
      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.className = type == "error" ? "banner error" : "banner";
        warning.appendChild(div);
        if (type != "error") setTimeout(function () { warning.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // sharp pixels on high-density screens, capped so big monitors stay fast
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      // The canvas always fills the page (and the itch.io frame); the game adapts to any size.
      function focusGame() { canvas.focus(); }
      canvas.addEventListener("pointerdown", focusGame);

      // Fullscreen comes from the game's settings (desktop) or the itch.io frame's own button.
      // Chrome and Edge: Esc stays with the game (pause) instead of leaving fullscreen; hold Esc to leave.
      // Other browsers leave fullscreen on Esc: the game pauses then and "Continue" brings fullscreen back.
      function onFullscreenChange() {
        var full = document.fullscreenElement || document.webkitFullscreenElement;
        if (full && navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(["Escape"]).catch(function () {});
      }
      document.addEventListener("fullscreenchange", onFullscreenChange);
      document.addEventListener("webkitfullscreenchange", onFullscreenChange);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var p = Math.round(progress * 100);
          fill.style.width = p + "%";
          percent.textContent = p + "%";
        }).then(function (unityInstance) {
          loading.classList.add("hidden");
          setTimeout(function () { loading.style.display = "none"; }, 600);
          // called by the game's "Fullscreen" setting (Plugins/WebGL/RulecrawlWeb.jslib)
          window.rulecrawlFullscreen = function () {
            unityInstance.SetFullscreen(1);
            focusGame();
          };
          focusGame();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
